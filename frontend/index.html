<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Panel Weterynaryjny</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-panel">
        <h2>Panel logowania</h2>
        <label>
            Wybierz typ użytkownika:
            <select id="userType">
                <option value="client">Klient</option>
                <option value="vet">Weterynarz</option>
            </select>
        </label>
        <button id="loginBtn">Zaloguj</button>
    </div>

    <div id="clientPanel" class="hidden">
        <h2>Pacjenci</h2>
        <ul>
            <li>Fido - ostatnia wizyta: 2025-12-20 <button>Umów wizytę</button></li>
            <li>Kitty - ostatnia wizyta: 2025-12-18 <button>Umów wizytę</button></li>
        </ul>
    </div>

<!-- Panel Weterynarza -->
<div id="vetPanel" class="hidden">
    <h2>Panel Weterynarza</h2>
   <ul>
        <button id="calendarBtn">Kalendarz</button>
        <button id="patientsBtn">Pacjenci</button>
        <button id="dayStatusBtn">Stan dnia: 3 wizyty do końca</button>
        <button id="pendingBtn"> Wizyty oczekujące do zatwierdzenia: 2</button>
    </ul>
</div>

<div id="calendarPanel" class="hidden">
    <h2>Kalendarz wizyt</h2>
    <div class="calendar-wrapper">
    <table class="calendar-table">
         <thead>
                <tr>
                    <th>Godzina</th>
                    <th>Pon</th>
                    <th>Wt</th>
                    <th>Śr</th>
                    <th>Czw</th>
                    <th>Pt</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>08:00</td>
                    <td></td>
                    <td>Fido</td>
                    <td></td>
                    <td>Kitty</td>
                    <td></td>
                </tr>
                <tr>
                    <td>10:00</td>
                    <td></td>
                    <td></td>
                    <td>Max</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr>
                    <td>12:00</td>
                    <td>Luna</td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td>Bella</td>
                </tr>
            </tbody>
        </table>
    </div>

    <button id="backToVet">Powrót</button>

</div>

<!-- PANEL PACJENTÓW WETERYNARZA -->
<div id="patientsPanel" class="hidden">
    <h2>Pacjenci Weterynarza</h2>

    <div class="patients-buttons">
        <button id="FidoBtn">Fido</button>
        <button id="KittyBtn">Kitty</button>
        <button id="MaxBtn">Max</button>
        <button id="LunaBtn">Luna</button>
    </div>

    <button id="backToVet1">Powrót</button>
</div>

<script src="script.js"></script>

</body>

</html>
